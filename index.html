<!DOCTYPE html>

<html>
<head>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
 <style>
        body {
            min-height: 100vh;
            margin: 0;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
        }
    </style>
</head>
<body>

    <h1 id="title">Change your condition</h1>

    <button id="resetButton">Give me an action</button>

    <p id="actionDisplay"></p>

    <script>

        function chooseAction() {
            const actions = [
                "Play 20 min of brick",
                "Spend 10 min with Abi",
                "meditate 10 mins",
                "cold water on face 10 pushups",
                "10 Hail Marys"
            ];

            const randomNumber = Math.floor(Math.random() * actions.length);

            const chosenAction = actions[randomNumber];

            document.getElementById("actionDisplay").textContent = chosenAction;
        }

        document.getElementById("resetButton").addEventListener("click", chooseAction);

    </script>

</body>

</html>
